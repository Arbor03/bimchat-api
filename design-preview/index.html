  <script>
  (()=>{

      if(state.tab==='progress')panel=`<div class="bc-box"><h3>Next step</h3><p>${isSheet?'Elira reviews version v3. Arta addresses the comments and publishes a response.':'The owner prepares the output by the due date in the register.'}</p><div class="bc-facts"><div><span class="bc-sub">Owner</span><strong>${d.owner}</strong></div><div><span class="bc-sub">Reviewer</span><strong>${isSheet?'Elira':'Not assigned'}</strong></div><div><span class="bc-sub">Due date</span><strong>${d.date}</strong></div></div></div>${isSheet?'<div class="bc-action-note">Updated input: Survey v2. The designer needs to assess its impact.</div>':'<p class="bc-sub">The deliverable workspace exists before the first file is uploaded.</p>'}`;
      if(state.tab==='inputs')panel=`<div class="bc-box"><h3>Input materials</h3>${line('Architecture · v12','Source model linked to this deliverable',badge('Referenced version'))}${line('Survey · v2','Reference updated since the latest work version',badge('Impact assessment needed'))}${line('Client requirement · 05','Decision on the ground floor layout')}</div>`;
      if(state.tab==='outputs')panel=isSheet?`<div class="bc-box"><h3>Work versions</h3>${line('v3 · PDF + DWG','Published by Arta · ready for review',`<button class="bc-btn" data-tab="review">View sheet</button>`)}${line('v2 · PDF + DWG','Source version for issue R01')}</div><div class="bc-box"><h3>Official revisions</h3>${line('R01 · Issued','Detailed Design-01 package · version v2',badge('Approved'))}</div><p class="bc-sub">Work version v3 has not yet been issued as a new official revision.</p>`:'<div class="bc-box"><h3>No published output yet</h3><p>The deliverable remains in the register with its owner and due date.</p></div>';
      if(state.tab==='history')panel=`<div class="bc-box"><h3>Workspace history</h3><div class="bc-event">${isSheet?'Arta published v3 for review':'Owner assigned'}<div class="bc-sub">15 November · version and author recorded</div></div><div class="bc-event">${isSheet?'Markup 01 added to v2':'Preparation due date set'}<div class="bc-sub">14 November · change recorded</div></div><div class="bc-event">Deliverable registered: ${d.id}<div class="bc-sub">10 November · workspace created</div></div></div>`;
      if(state.tab==='review')panel=isSheet?`<div class="bc-toolbar"><span>Sheet v3 · illustrative preview</span>${badge('Ready for recheck')}</div><div class="bc-review"><div class="bc-sheet"><div class="bc-sub">A-101 / GROUND FLOOR</div><div class="bc-plan" aria-label="Illustrative floor plan with markup 01"><div class="bc-room">Room</div><div class="bc-hall"></div><div class="bc-room">Room</div><div class="bc-room">Space</div><div class="bc-room">Space</div><button class="bc-mark" data-note="01" aria-label="Markup 01: check the door opening"><span>1</span></button></div><div class="bc-sub">Park Residences · A-101 · v3</div></div><aside class="bc-note"><h3>01 · Door opening</h3><p>Check the door swing against the clear passage width.</p><p class="bc-sub">Elira · original markup on v2<br>Arta · response in v3</p>${badge('Ready for recheck')}<div class="bc-lineitem"><div>Linked task<div class="bc-sub">The same issue also appears in the task list</div></div></div><p class="bc-sub">Displaying this markup on the Revit sheet is part of the proposed workflow.</p></aside></div>`:'<div class="bc-box"><h3>Review starts after publication</h3><p>Markups will be linked to the specific output version.</p></div>';
      content.innerHTML=`<button class="bc-link bc-back" data-back="true">← Documentation register</button><h2>${d.id} — ${d.name}</h2><p class="bc-sub">Deliverable workspace · ${d.type} · Issued revision ${d.revision}</p>${badge(d.status)}<div class="bc-tabs" role="tablist" aria-label="Deliverable workspace">${Object.entries(tabs).map(([k,v])=>`<button id="bc-tab-${k}" role="tab" data-tab="${k}" aria-selected="${state.tab===k}" aria-controls="bc-detail">${v}</button>`).join('')}</div><section id="bc-detail" role="tabpanel" aria-labelledby="bc-tab-${state.tab}">${panel}</section>`;
    }
    root.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.dataset.screen){state.screen=b.dataset.screen;state.selected=null;}
      else if(b.dataset.collapse){state.collapsed=!state.collapsed;try{localStorage.setItem('bimchat-concept-menu-collapsed',String(state.collapsed));}catch{}}
      else if(b.dataset.model){state.sceneModels=[b.dataset.model];state.chatModel=b.dataset.model;state.viewerOpen=true;state.modelView='all';state.screen='models';state.selected=null;}
      else if(b.dataset.openModels){if(!state.selectedModels.length)return;state.sceneModels=[...state.selectedModels];state.viewerOpen=true;state.chatModel=state.sceneModels.length===1?state.sceneModels[0]:'project';state.modelView='all';}
      else if(b.dataset.clearModels){state.selectedModels=[];}
      else if(b.dataset.selectFiltered){state.selectedModels=[...new Set([...state.selectedModels,...filteredModels().map(m=>m.id)])];}
      else if(b.dataset.modelGroup){const g=b.dataset.modelGroup;state.closedModelGroups=state.closedModelGroups.includes(g)?state.closedModelGroups.filter(x=>x!==g):[...state.closedModelGroups,g];}
      else if(b.dataset.modelBack){state.selectedModels=[...state.sceneModels];state.viewerOpen=false;}
      else if(b.dataset.modelView){state.modelView=b.dataset.modelView;}
      else if(b.dataset.expandFolder){const id=b.dataset.expandFolder;state.expandedFolders=state.expandedFolders.includes(id)?state.expandedFolders.filter(x=>x!==id):[...state.expandedFolders,id];}
      else if(b.dataset.folder){state.folder=b.dataset.folder;state.file=null;state.selected=null;state.screen='files';let f=folders.find(x=>x.id===state.folder);while(f){if(!state.expandedFolders.includes(f.id)&&folders.some(x=>x.parent===f.id))state.expandedFolders.push(f.id);f=folders.find(x=>x.id===f.parent);}}
      else if(b.dataset.file){state.file=b.dataset.file;}
      else if(b.dataset.doc){state.selected=b.dataset.doc;state.screen='documentation';state.tab=b.dataset.openTab||'progress';}
      else if(b.dataset.tab){state.tab=b.dataset.tab;}
      else if(b.dataset.back){state.selected=null;state.screen='documentation';}
      else if(b.dataset.note){root.querySelector('.bc-note')?.scrollIntoView({block:'nearest'});return;}
      else return;
      render();persist();
    });
    root.addEventListener('input',event=>{
      if(event.target.id!=='bc-model-search')return;
      const position=event.target.selectionStart;state.modelSearch=event.target.value;render();
      const input=root.querySelector('#bc-model-search');input.focus();if(position!==null)input.setSelectionRange(position,position);
    });
    root.addEventListener('change',event=>{
      const el=event.target;
      if(el.dataset.selectModel){state.selectedModels=el.checked?[...new Set([...state.selectedModels,el.dataset.selectModel])]:state.selectedModels.filter(id=>id!==el.dataset.selectModel);}
      else if(el.dataset.sceneModel){state.sceneModels=el.checked?[...new Set([...state.sceneModels,el.dataset.sceneModel])]:state.sceneModels.filter(id=>id!==el.dataset.sceneModel);}
      else if(el.id==='bc-chat-context'){state.chatModel=el.value;}
      else if(el.id==='bc-model-building'){state.modelBuilding=el.value;}
      else if(el.id==='bc-model-discipline'){state.modelDiscipline=el.value;}
      else return;
      render();persist();
    });
    roleSelect.addEventListener('change',()=>{state.role=roleSelect.value;render();persist();});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    render();
    if(globalThis.Tweak){const settings={spacing:'Comfortable'};const tweak=new Tweak({container:root,onChange:()=>{content.style.padding=settings.spacing==='Compact'?'17px':'25px';}});tweak.addSelect(settings,'spacing',{label:'Density',options:['Comfortable','Compact']});}
  })();
  </script>
</div>
</body></html>
